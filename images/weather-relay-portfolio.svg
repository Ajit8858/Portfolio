<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Weather relay — portfolio preview</title>
<desc>A browser window showing the Weather relay app: a search bar, a five day forecast for Bengaluru, and a panel tracing the two backend API calls that produced it.</desc>

<rect width="1200" height="800" fill="#eef2f1"/>

<!-- Browser window -->
<g>
  <rect x="80" y="70" width="1040" height="660" rx="10" fill="#ffffff" stroke="#cbd5d9" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="80" y="70" width="1040" height="44" rx="10" fill="#f5f7f6" stroke="#cbd5d9" stroke-width="1.5"/>
  <rect x="80" y="96" width="1040" height="18" fill="#f5f7f6"/>
  <circle cx="108" cy="92" r="6" fill="#e0958a"/>
  <circle cx="130" cy="92" r="6" fill="#e6c17a"/>
  <circle cx="152" cy="92" r="6" fill="#8fbf9a"/>
  <rect x="380" y="80" width="440" height="24" rx="6" fill="#ffffff" stroke="#dbe1e0"/>
  <text x="400" y="97" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5a6b75">localhost:3000</text>

  <!-- page content -->
  <text x="120" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#14222b">Weather relay</text>
  <text x="120" y="195" font-family="Arial, sans-serif" font-size="15" fill="#5a6b75">Your browser asks a small server for a forecast. The server looks up the</text>
  <text x="120" y="215" font-family="Arial, sans-serif" font-size="15" fill="#5a6b75">city, calls a weather API, and shows every step it took.</text>

  <!-- search row -->
  <rect x="120" y="240" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd5d9"/>
  <text x="138" y="266" font-family="Arial, sans-serif" font-size="15" fill="#8f9a9f">Bengaluru</text>
  <rect x="462" y="240" width="90" height="42" rx="6" fill="#ffffff" stroke="#cbd5d9"/>
  <text x="480" y="266" font-family="Arial, sans-serif" font-size="14" fill="#14222b">°C</text>
  <rect x="562" y="240" width="150" height="42" rx="6" fill="#0b6e8a"/>
  <text x="586" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Get forecast</text>

  <!-- two panels -->
  <rect x="120" y="310" width="490" height="380" rx="8" fill="#ffffff" stroke="#cbd5d9"/>
  <rect x="630" y="310" width="450" height="380" rx="8" fill="#ffffff" stroke="#cbd5d9"/>

  <!-- left panel: forecast -->
  <text x="146" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14222b">Forecast</text>
  <text x="146" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14222b">Bengaluru, Karnataka, India</text>
  <text x="146" y="393" font-family="Arial, sans-serif" font-size="12" fill="#8f9a9f">Fetched 4:12 PM</text>
  <text x="146" y="450" font-family="Arial, sans-serif" font-size="56" font-weight="200" fill="#14222b">26°C</text>
  <text x="320" y="450" font-family="Arial, sans-serif" font-size="16" fill="#5a6b75">Partly cloudy</text>
  <text x="146" y="478" font-family="Arial, sans-serif" font-size="13" fill="#8f9a9f">Feels like 27°C. Humidity 70%. Wind 9 km/h.</text>

  <line x1="146" y1="500" x2="586" y2="500" stroke="#e2e7e6"/>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="146" y="530" fill="#14222b">Sun 21</text><text x="260" y="530" fill="#5a6b75">Partly cloudy</text><text x="500" y="530" fill="#8f9a9f" text-anchor="end">20° / 28°</text>
    <text x="146" y="560" fill="#14222b">Mon 22</text><text x="260" y="560" fill="#5a6b75">Rain</text><text x="500" y="560" fill="#8f9a9f" text-anchor="end">19° / 27°</text>
    <text x="146" y="590" fill="#14222b">Tue 23</text><text x="260" y="590" fill="#5a6b75">Rain</text><text x="500" y="590" fill="#8f9a9f" text-anchor="end">19° / 26°</text>
    <text x="146" y="620" fill="#14222b">Wed 24</text><text x="260" y="620" fill="#5a6b75">Overcast</text><text x="500" y="620" fill="#8f9a9f" text-anchor="end">20° / 27°</text>
    <text x="146" y="650" fill="#14222b">Thu 25</text><text x="260" y="650" fill="#5a6b75">Mainly clear</text><text x="500" y="650" fill="#8f9a9f" text-anchor="end">20° / 29°</text>
  </g>

  <!-- right panel: trace -->
  <text x="656" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14222b">What the server did</text>

  <g>
    <text x="656" y="378" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14222b">Browser to this server</text>
    <text x="1056" y="378" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5a6b75" text-anchor="end">142 ms</text>
    <text x="656" y="394" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8f9a9f">localhost:3000/api/weather</text>
    <rect x="656" y="404" width="400" height="6" rx="3" fill="#eef2f1"/>
    <rect x="656" y="404" width="180" height="6" rx="3" fill="#8f9a9f"/>
  </g>

  <line x1="656" y1="432" x2="1056" y2="432" stroke="#e2e7e6"/>

  <g>
    <text x="656" y="458" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14222b">Geocoding API</text>
    <text x="1056" y="458" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5a6b75" text-anchor="end">61 ms</text>
    <text x="656" y="474" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8f9a9f">geocoding-api.open-meteo.com</text>
    <rect x="656" y="484" width="400" height="6" rx="3" fill="#eef2f1"/>
    <rect x="656" y="484" width="96" height="6" rx="3" fill="#0b6e8a"/>
  </g>

  <line x1="656" y1="512" x2="1056" y2="512" stroke="#e2e7e6"/>

  <g>
    <text x="656" y="538" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14222b">Forecast API</text>
    <text x="1056" y="538" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5a6b75" text-anchor="end">73 ms</text>
    <text x="656" y="554" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8f9a9f">api.open-meteo.com</text>
    <rect x="656" y="564" width="400" height="6" rx="3" fill="#eef2f1"/>
    <rect x="656" y="564" width="115" height="6" rx="3" fill="#0b6e8a"/>
  </g>

  <text x="656" y="608" font-family="Arial, sans-serif" font-size="12" fill="#8f9a9f">Two calls in sequence — the forecast call needs the</text>
  <text x="656" y="626" font-family="Arial, sans-serif" font-size="12" fill="#8f9a9f">coordinates the first one returns.</text>

  <rect x="656" y="648" width="380" height="30" rx="6" fill="#eef2f1"/>
  <text x="668" y="667" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5a6b75">▸ Response JSON</text>
</g>
</svg>
